name: Make AUR Packages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.filter.outputs.packages }}
      outdated: ${{ steps.filter.outputs.outdated }}
    steps:
      - uses: actions/checkout@v7

      - name: Filter packages that need building
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          packages=$(jq -R -s -c 'split("\n") | map(select(length > 0))' packages.list)
          echo "packages=$packages" >> $GITHUB_OUTPUT

          aur_args=$(sed 's/^/arg[]=/g' packages.list | tr '\n' '&' | sed 's/&$//')
          aur_data=$(curl -s "https://aur.archlinux.org/rpc/v5/info?${aur_args}")

          assets=$(gh release view latest --repo ${{ github.repository }} \
            --json assets --jq '[.assets[].name]' 2>/dev/null || echo '[]')

          to_build=()
          while IFS= read -r pkg; do
            aur_version=$(echo "$aur_data" | jq -r ".results[] | select(.Name == \"${pkg}\") | .Version")
            safe_version="${aur_version//:/\.}"
            existing=$(echo "$assets" | jq -r ".[] | select(startswith(\"${pkg}-${safe_version}-\"))")
            if [ -n "$existing" ]; then
              echo "$pkg $aur_version: up to date, skipping"
            elif [[ "$pkg" =~ -(git|svn|hg|bzr)$ ]]; then
              # VCS packages: AUR .SRCINFO version lags behind the actual built version.
              # Skip rebuild if our release already has a higher revision (rN) than AUR reports.
              existing_asset=$(echo "$assets" | jq -r ".[] | select(startswith(\"${pkg}-\") and endswith(\".pkg.tar.zst\"))" | head -1)
              existing_rev=$(echo "$existing_asset" | grep -oE '\.r[0-9]+' | grep -oE '[0-9]+' | head -1)
              aur_rev=$(echo "$safe_version" | grep -oE 'r[0-9]+' | grep -oE '[0-9]+' | head -1)
              if [ -n "$existing_rev" ] && [ -n "$aur_rev" ] && [ "$existing_rev" -ge "$aur_rev" ]; then
                echo "$pkg $aur_version: up to date (r$existing_rev >= r$aur_rev), skipping"
              else
                echo "$pkg $aur_version: needs building"
                to_build+=("$pkg")
              fi
            else
              echo "$pkg $aur_version: needs building"
              to_build+=("$pkg")
            fi
          done < packages.list

          outdated=$(printf '%s\n' "${to_build[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "outdated=$outdated" >> $GITHUB_OUTPUT

  make:
    needs: [prepare]
    if: needs.prepare.outputs.outdated != '[]'
    runs-on: ubuntu-latest
    permissions: {}
    container:
      image: ghcr.io/its-me/archlinux:builder
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        package: ${{ fromJson(needs.prepare.outputs.outdated) }}
      fail-fast: false

    steps:
      - name: Make package
        env:
          PACKAGER: Sergey Kanafyev <${{ github.event.pusher.email || 'sergeykanafyev@gmail.com' }}>
          PACKAGE: ${{ matrix.package }}
        run: |
          su - builder -c "
            export PACKAGER='${PACKAGER}'
            export COMPRESSZST='(zstd -c -T0 --ultra -20 -)'
            paru -S ${PACKAGE} --noconfirm --skipreview --noprogressbar --removemake --mflags "--nocheck"
          "

      - name: Copy package to workspace
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          find /home/builder/.cache/paru/clone/${PACKAGE} -maxdepth 1 -name "*.pkg.tar.zst" ! -name "*-debug-*" -exec cp --verbose {} . \;

      - name: Replace colons in filenames
        run: |
          for f in *.pkg.tar.zst; do
            newf="${f//:/.}"
            if [ "$f" != "$newf" ]; then mv -v "$f" "$newf"; fi
          done

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}
          path: "*.pkg.tar.zst"
          if-no-files-found: error

  release:
    needs: [make, prepare]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: ghcr.io/its-me/archlinux:builder
    defaults:
      run:
        shell: bash

    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "*"
          merge-multiple: true
          path: repo/

      - name: Reuse unchanged packages from latest release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGES_JSON: ${{ needs.prepare.outputs.packages }}
        run: |
          mkdir -p repo/ old-release/
          gh release download latest --repo ${{ github.repository }} \
            --pattern "*.pkg.tar.zst" --dir old-release/ 2>/dev/null || true
          packages="$PACKAGES_JSON"
          for pkg in $(echo "$packages" | jq -r '.[]'); do
            if ls repo/ | grep -qE "^${pkg}-[[:digit:]].*\.pkg\.tar\.zst$"; then
              echo "$pkg: newly built, skipping"
              continue
            fi
            existing=$(ls old-release/ | grep -Em1 "^${pkg}-[[:digit:]].*\.pkg\.tar\.zst$" || true)
            if [ -n "$existing" ]; then
              echo "$pkg: reusing $existing"
              cp "old-release/$existing" repo/
            else
              echo "$pkg: not found in old release, will be missing"
            fi
          done

      - name: Create repository database and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGES_JSON: ${{ needs.prepare.outputs.packages }}
        run: |
          cd repo
          shopt -s nullglob
          pkgs=(*.pkg.tar.zst)
          if [ ${#pkgs[@]} -eq 0 ]; then
            echo "No packages built successfully, skipping release"
            exit 0
          fi

          repo-add aur-packages.db.tar.gz "${pkgs[@]}"

          make_notes() {
            local count=$1
            cat <<EOF
          Arch Linux custom repository containing $count packages.

          Add to \`/etc/pacman.conf\`:
          \`\`\`ini
          [aur-packages]
          SigLevel = Optional TrustAll
          Server = https://github.com/$GITHUB_REPOSITORY/releases/download/latest
          \`\`\`
          EOF
          }

          if ! gh release view latest --repo ${{ github.repository }} > /dev/null 2>&1; then
            gh release create latest * \
              --repo ${{ github.repository }} \
              --title "Latest Versions" \
              --notes "$(make_notes ${#pkgs[@]})"
          else
            packages="$PACKAGES_JSON"
            for pkg in $(echo "$packages" | jq -r '.[]'); do
              new_name=$(ls | grep -Em1 "^${pkg}-[[:digit:]].*\.pkg\.tar\.zst$" || true)
              [ -z "$new_name" ] && continue
              old_name=$(ls ../old-release/ | grep -Em1 "^${pkg}-[[:digit:]].*\.pkg\.tar\.zst$" || true)
              if [ -z "$old_name" ] || [ "$old_name" != "$new_name" ]; then
                [ -n "$old_name" ] && { echo "Removing old: $old_name"; gh release delete-asset latest "$old_name" --repo ${{ github.repository }} --yes 2>/dev/null || true; }
                echo "Uploading: $new_name"
                gh release upload latest "$new_name" --repo ${{ github.repository }} --clobber
              fi
            done
            gh release upload latest \
              aur-packages.db.tar.gz aur-packages.db \
              aur-packages.files.tar.gz aur-packages.files \
              --repo ${{ github.repository }} --clobber
            actual_count=$(gh release view latest --repo ${{ github.repository }} \
              --json assets --jq '[.assets[].name | select(endswith(".pkg.tar.zst"))] | length')
            gh release edit latest --repo ${{ github.repository }} \
              --title "Latest Versions" --notes "$(make_notes $actual_count)"
          fi
