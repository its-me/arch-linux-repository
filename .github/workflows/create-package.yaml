name: Build Arch Package

on:
  push:
    branches:
      - main
#  schedule:
#    - cron: '0 2 * * *'
#  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git sudo fontconfig github-cli tree

      - name: Create build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Clone AUR package
        run: su - builder -c "git clone https://aur.archlinux.org/ttf-google-fonts-git.git"

      - name: Build package
        run: su - builder -c "cd ttf-google-fonts-git && makepkg --nodeps --noconfirm"

      - name: Copy package to workspace
        run: |
          cp /home/builder/ttf-google-fonts-git/*.pkg.tar.zst .

      - name: Create apk release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pwd
          tree
          gh release create package-version *.pkg.tar.zst
