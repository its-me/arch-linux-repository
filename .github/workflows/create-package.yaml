name: Build Arch Package

on:
  # push:
  #   branches:
  #     - main
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm github-cli

      - name: Get latest commit hash from fonts repository
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="google/fonts"
          BRANCH="main"
          
          FONTS_HASH=$(gh api "repos/$REPO/commits/$BRANCH" --jq '.sha[0:9]')
          
          RELEASE_HASH=$(gh release view --json tagName --jq '.tagName' --repo ${{ github.repository }} | cut -d'.' -f2)
         
          echo "FONTS_HASH=$FONTS_HASH" >> $GITHUB_OUTPUT
          echo "RELEASE_HASH=$RELEASE_HASH" >> $GITHUB_OUTPUT

          echo FONTS_HASH: $FONTS_HASH
          echo RELEASE_HASH: $RELEASE_HASH

          if [ "$FONTS_HASH" == "$RELEASE_HASH" ]; then
            echo "Hashes are equal. No new changes. Stopping workflow."
            exit 1
          fi

      - name: Install required packages
        run: pacman -S --noconfirm base-devel git sudo fontconfig

      - name: Create build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Clone AUR package
        run: su - builder -c "git clone https://aur.archlinux.org/ttf-google-fonts-git.git"

      - name: Build package
        env:
          PACKAGER: Sergey Kanafyev <${{ github.event.pusher.email }}>
          COMPRESSZST: '(zstd -c -T0 --ultra -20 -)'
        run: su - builder -c "cd ttf-google-fonts-git && makepkg --nodeps --noconfirm"

      - name: Copy package to workspace
        run: cp --verbose /home/builder/ttf-google-fonts-git/*.pkg.tar.zst .

      - name: Extract version from package
        run: |
          PACKAGE_VERSION=$(pacman -Qip *.pkg.tar.zst | grep "^Version" | awk '{print $3}')
          CURRENT_VERSION=$(echo $PACKAGE_VERSION | cut -d':' -f2 | cut -d'-' -f1)
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV
          echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_ENV
          echo "Package version: $PACKAGE_VERSION"
          echo "Current version: $CURRENT_VERSION"

      - name: Create apk release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo CURRENT_VERSION: $CURRENT_VERSION
          gh release create $CURRENT_VERSION *.pkg.tar.zst --repo ${{ github.repository }} --notes "Version: PACKAGE_VERSION"
