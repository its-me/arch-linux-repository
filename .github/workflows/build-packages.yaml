name: Build AUR Packages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.filter.outputs.packages }}
      outdated: ${{ steps.filter.outputs.outdated }}
    steps:
      - uses: actions/checkout@v6

      - name: Filter packages that need building
        id: filter
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          packages=$(jq -R -s -c 'split("\n") | map(select(length > 0))' packages)
          echo "packages=$packages" >> $GITHUB_OUTPUT

          aur_args=$(sed 's/^/arg[]=/g' packages | tr '\n' '&' | sed 's/&$//')
          aur_data=$(curl -s "https://aur.archlinux.org/rpc/v5/info?${aur_args}")

          assets=$(gh release view latest --repo ${{ github.repository }} \
            --json assets --jq '[.assets[].name]' 2>/dev/null || echo '[]')

          to_build=()
          while IFS= read -r pkg; do
            aur_version=$(echo "$aur_data" | jq -r ".results[] | select(.Name == \"${pkg}\") | .Version")
            safe_version="${aur_version//:/\.}"
            existing=$(echo "$assets" | jq -r ".[] | select(startswith(\"${pkg}-${safe_version}-\"))")
            if [ -n "$existing" ]; then
              echo "$pkg $aur_version: up to date, skipping"
            elif [[ "$pkg" =~ -(git|svn|hg|bzr)$ ]]; then
              # VCS packages: AUR .SRCINFO version lags behind the actual built version.
              # Skip rebuild if our release already has a higher revision (rN) than AUR reports.
              existing_asset=$(echo "$assets" | jq -r ".[] | select(startswith(\"${pkg}-\") and endswith(\".pkg.tar.zst\"))" | head -1)
              existing_rev=$(echo "$existing_asset" | grep -oE '\.r[0-9]+' | grep -oE '[0-9]+' | head -1)
              aur_rev=$(echo "$safe_version" | grep -oE 'r[0-9]+' | grep -oE '[0-9]+' | head -1)
              if [ -n "$existing_rev" ] && [ -n "$aur_rev" ] && [ "$existing_rev" -ge "$aur_rev" ]; then
                echo "$pkg $aur_version: up to date (r$existing_rev >= r$aur_rev), skipping"
              else
                echo "$pkg $aur_version: needs building"
                to_build+=("$pkg")
              fi
            else
              echo "$pkg $aur_version: needs building"
              to_build+=("$pkg")
            fi
          done < packages

          outdated=$(printf '%s\n' "${to_build[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "outdated=$outdated" >> $GITHUB_OUTPUT

  make:
    needs: [prepare]
    if: needs.prepare.outputs.outdated != '[]'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/its-me/arch-linux:builder
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        package: ${{ fromJson(needs.prepare.outputs.outdated) }}
      fail-fast: false

    steps:
      - name: Build package
        env:
          PACKAGER: Sergey Kanafyev <${{ github.event.pusher.email || 'sergeykanafyev@gmail.com' }}>
        run: |
          su - builder -c "
            export PACKAGER='${PACKAGER}'
            export COMPRESSZST='(zstd -c -T0 --ultra -20 -)'
            paru -S ${{ matrix.package }} --noconfirm --skipreview --noprogressbar --removemake --mflags "--nocheck"
          "

      - name: Copy package to workspace
        run: |
          find /home/builder/.cache/paru/clone/${{ matrix.package }} -maxdepth 1 -name "*.pkg.tar.zst" ! -name "*-debug-*" -exec cp --verbose {} . \;

      - name: Replace colons in filenames
        run: |
          for f in *.pkg.tar.zst; do
            newf="${f//:/.}"
            if [ "$f" != "$newf" ]; then mv -v "$f" "$newf"; fi
          done

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}
          path: "*.pkg.tar.zst"
          if-no-files-found: error

  release:
    needs: [make, prepare]
    if: always()
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/its-me/arch-linux:builder
    defaults:
      run:
        shell: bash

    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "*"
          merge-multiple: true
          path: repo/

      - name: Reuse unchanged packages from latest release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p old-release/
          gh release download latest --repo ${{ github.repository }} \
            --pattern "*.pkg.tar.zst" --dir old-release/ 2>/dev/null || true
          packages='${{ needs.prepare.outputs.packages }}'
          for pkg in $(echo "$packages" | jq -r '.[]'); do
            if ls repo/${pkg}-*.pkg.tar.zst 2>/dev/null | grep -q .; then
              echo "$pkg: newly built, skipping"
              continue
            fi
            existing=$(ls old-release/${pkg}-*.pkg.tar.zst 2>/dev/null | head -1)
            if [ -n "$existing" ]; then
              echo "$pkg: reusing $(basename $existing)"
              cp "$existing" repo/
            else
              echo "$pkg: not found in old release, will be missing"
            fi
          done

      - name: Create repository database and publish release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd repo
          shopt -s nullglob
          pkgs=(*.pkg.tar.zst)
          if [ ${#pkgs[@]} -eq 0 ]; then
            echo "No packages built successfully, skipping release"
            exit 0
          fi

          repo-add aur-packages.db.tar.gz "${pkgs[@]}"

          gh release delete latest --repo ${{ github.repository }} --yes 2>/dev/null || true
          gh api --method DELETE "/repos/${{ github.repository }}/git/refs/tags/latest" 2>/dev/null || true

          gh release create latest * \
            --repo ${{ github.repository }} \
            --title "Latest Versions" \
            --notes "$(cat <<EOF
          Arch Linux custom repository containing ${#pkgs[@]} packages.

          Add to /etc/pacman.conf:
          \`\`\`ini
          [aur-packages]
          SigLevel = Optional TrustAll
          Server = https://github.com/$GITHUB_REPOSITORY/releases/download/latest
          \`\`\`
          EOF
          )"
