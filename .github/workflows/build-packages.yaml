name: Build AUR Packages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  packages: write

jobs:
  list-packages:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.read.outputs.packages }}
    steps:
      - uses: actions/checkout@v6

      - name: Read package list
        id: read
        run: |
          packages=$(jq -R -s -c 'split("\n") | map(select(length > 0))' packages)
          echo "packages=$packages" >> $GITHUB_OUTPUT

  bootstrap:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - name: Pull base image
        run: docker pull archlinux:latest

      - name: Build image
        id: build
        run: |
          cat > /tmp/setup.sh << 'EOF'
          set -e
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git sudo github-cli
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          su - builder -c 'git clone https://aur.archlinux.org/paru.git && cd paru && makepkg --syncdeps --noconfirm'
          pacman -U /home/builder/paru/*.pkg.tar.zst --noconfirm
          EOF

          docker run --name arch-builder -v /tmp/setup.sh:/setup.sh archlinux:latest bash /setup.sh
          docker commit arch-builder arch-builder-image
          docker rm arch-builder

          hash=$(docker run --rm arch-builder-image pacman -Q | sha256sum | cut -d' ' -f1 | cut -c1-12)
          echo "image=ghcr.io/${{ github.repository }}:$hash" >> $GITHUB_OUTPUT

      - name: Restore image cache
        id: cache
        run: |
          if docker manifest inspect ${{ steps.build.outputs.image }} > /dev/null 2>&1; then
            echo "cache-hit=true" >> $GITHUB_OUTPUT
          else
            echo "cache-hit=false" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR
        if: steps.cache.outputs.cache-hit != 'true'
        run: echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push image to GHCR
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker tag arch-builder-image ${{ steps.build.outputs.image }}
          docker tag arch-builder-image ghcr.io/${{ github.repository }}:latest
          docker push ${{ steps.build.outputs.image }}
          docker push ghcr.io/${{ github.repository }}:latest

  build:
    needs: [list-packages, bootstrap]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.bootstrap.outputs.image }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        package: ${{ fromJson(needs.list-packages.outputs.packages) }}
      fail-fast: false

    steps:
      - name: Build package
        env:
          PACKAGER: Sergey Kanafyev <${{ github.event.pusher.email || 'sergeykanafyev@gmail.com' }}>
        run: |
          su - builder -c "
            export PACKAGER='${PACKAGER}'
            export COMPRESSZST='(zstd -c -T0 --ultra -20 -)'
            paru -S ${{ matrix.package }} --noconfirm --skipreview --noprogressbar --removemake
          "

      - name: Copy package to workspace
        run: |
          find /home/builder/.cache/paru/clone/${{ matrix.package }} -maxdepth 1 -name "*.pkg.tar.zst" ! -name "*-debug-*" -exec cp --verbose {} . \;

      - name: Encode colons in filenames for artifact upload
        run: |
          for f in *.pkg.tar.zst; do
            newf="${f//:/%3a}"
            if [ "$f" != "$newf" ]; then mv -v "$f" "$newf"; fi
          done

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}
          path: "*.pkg.tar.zst"
          if-no-files-found: error

  release:
    needs: [build, bootstrap]
    if: always()
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.bootstrap.outputs.image }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "*"
          merge-multiple: true
          path: repo/

      - name: Decode colons in filenames
        run: |
          cd repo
          for f in *.pkg.tar.zst; do
            newf="${f//%3a/:}"
            if [ "$f" != "$newf" ]; then mv -v "$f" "$newf"; fi
          done

      - name: Create repository database and publish release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd repo
          shopt -s nullglob
          pkgs=(*.pkg.tar.zst)
          if [ ${#pkgs[@]} -eq 0 ]; then
            echo "No packages built successfully, skipping release"
            exit 0
          fi

          repo-add aur.db.tar.gz "${pkgs[@]}"

          gh release delete latest --repo ${{ github.repository }} --yes 2>/dev/null || true
          gh api --method DELETE "/repos/${{ github.repository }}/git/refs/tags/latest" 2>/dev/null || true

          gh release create latest * \
            --repo ${{ github.repository }} \
            --title "Latest Versions" \
            --notes "$(cat <<EOF
          Arch Linux custom repository containing ${#pkgs[@]} packages.

          Add to /etc/pacman.conf:
          \`\`\`ini
          [aur]
          SigLevel = Optional TrustAll
          Server = https://github.com/$GITHUB_REPOSITORY/releases/download/latest
          \`\`\`
          EOF
          )"
