name: Build AUR Packages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.read.outputs.packages }}
    steps:
      - uses: actions/checkout@v4

      - name: Read package list
        id: read
        run: |
          packages=$(jq -R -s -c 'split("\n") | map(select(length > 0))' packages)
          echo "packages=$packages" >> $GITHUB_OUTPUT

  build:
    needs: setup
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    strategy:
      matrix:
        package: ${{ fromJson(needs.setup.outputs.packages) }}
      fail-fast: false

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git sudo

      - name: Create build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Clone AUR package
        run: su - builder -c "git clone https://aur.archlinux.org/${{ matrix.package }}.git"

      - name: Build package
        env:
          PACKAGER: Sergey Kanafyev <${{ github.event.pusher.email || 'sergeykanafyev@gmail.com' }}>
          COMPRESSZST: (zstd -c -T0 --ultra -20 -)
        run: su - builder -c "cd ${{ matrix.package }} && makepkg --syncdeps --noconfirm"

      - name: Copy package to workspace
        run: cp --verbose /home/builder/${{ matrix.package }}/*.pkg.tar.zst .

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.package }}
          path: "*.pkg.tar.zst"
          if-no-files-found: error

  release:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm github-cli

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: repo/

      - name: Create repository database and publish release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd repo
          shopt -s nullglob
          pkgs=(*.pkg.tar.zst)
          if [ ${#pkgs[@]} -eq 0 ]; then
            echo "No packages built successfully, skipping release"
            exit 0
          fi

          repo-add arch-linux-repository.db.tar.gz "${pkgs[@]}"
          cp arch-linux-repository.db.tar.gz arch-linux-repository.db
          cp arch-linux-repository.files.tar.gz arch-linux-repository.files

          gh release delete latest --repo ${{ github.repository }} --yes 2>/dev/null || true
          gh api --method DELETE "/repos/${{ github.repository }}/git/refs/tags/latest" 2>/dev/null || true

          gh release create latest * \
            --repo ${{ github.repository }} \
            --title "Latest Build" \
            --notes "$(cat <<EOF
          Arch Linux custom repository containing ${#pkgs[@]} packages.

          Add to /etc/pacman.conf:
          \`\`\`ini
          [arch-linux-repository]
          Server = https://github.com/$GITHUB_REPOSITORY/releases/download/latest
          \`\`\`
          EOF
          )"
